<ellipse cx="400" cy="664" rx="150" ry="26" fill="#1b1d20" opacity="0.28" filter="url(#drop)"/>
<rect x="276" y="212" width="248" height="432" rx="32" fill="url(#red)" stroke="#5a5f66" stroke-width="4"/>
<rect x="296" y="236" width="56" height="200" rx="24" fill="url(#gloss)"/>
