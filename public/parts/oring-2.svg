<ellipse cx="400" cy="386" rx="146" ry="40" fill="none" stroke="url(#dark)" stroke-width="30"/>
<ellipse cx="400" cy="454" rx="124" ry="33" fill="none" stroke="url(#red)" stroke-width="30"/>
<ellipse cx="400" cy="522" rx="102" ry="26" fill="none" stroke="url(#dark)" stroke-width="30"/>
