    <stop offset="22%"  stop-color="#dfe2e5"/>
    <stop offset="55%"  stop-color="#b4b9bf"/>
    <stop offset="100%" stop-color="#787d85"/>
  </linearGradient>

  <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
