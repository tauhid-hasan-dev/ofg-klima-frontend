<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img">
<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="72%">
    <stop offset="0%" stop-color="#fbfbfa"/>
    <stop offset="100%" stop-color="#ececea"/>
  </radialGradient>

  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#b9bcc0"/>
    <stop offset="18%"  stop-color="#eef0f2"/>
    <stop offset="45%"  stop-color="#c8ccd1"/>
    <stop offset="72%"  stop-color="#8f949b"/>
    <stop offset="100%" stop-color="#6d727a"/>
  </linearGradient>

  <linearGradient id="steelX" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#80858d"/>
    <stop offset="22%"  stop-color="#dfe2e5"/>
    <stop offset="55%"  stop-color="#b4b9bf"/>
    <stop offset="100%" stop-color="#787d85"/>
  </linearGradient>

  <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#d7dbe0"/>
    <stop offset="35%"  stop-color="#f3f5f7"/>
    <stop offset="70%"  stop-color="#bcc1c8"/>
    <stop offset="100%" stop-color="#90959d"/>
  </linearGradient>

  <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#4a4d52"/>
    <stop offset="30%"  stop-color="#2e3135"/>
    <stop offset="100%" stop-color="#17191c"/>
  </linearGradient>

  <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#e3c88b"/>
    <stop offset="35%"  stop-color="#c9a95b"/>
    <stop offset="100%" stop-color="#8d7332"/>
  </linearGradient>

  <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#f4585e"/>
    <stop offset="45%"  stop-color="#e71a21"/>
    <stop offset="100%" stop-color="#a30f15"/>
  </linearGradient>

  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <radialGradient id="hub" cx="38%" cy="32%" r="75%">
    <stop offset="0%"   stop-color="#f2f4f6"/>
    <stop offset="55%"  stop-color="#b6bbc1"/>
    <stop offset="100%" stop-color="#70757d"/>
  </radialGradient>

  <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>

  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>
<ellipse cx="400" cy="630" rx="230" ry="30" fill="#1b1d20" opacity="0.28" filter="url(#drop)"/>
<circle cx="300" cy="320" r="150" fill="none" stroke="url(#dark)" stroke-width="42"/><circle cx="300" cy="320" r="150" fill="none" stroke="#ffffff" stroke-width="12.6" opacity="0.22" transform="rotate(-35 300 320)" stroke-dasharray="165 750"/>
<circle cx="520" cy="430" r="110" fill="none" stroke="url(#red)" stroke-width="34"/><circle cx="520" cy="430" r="110" fill="none" stroke="#ffffff" stroke-width="10.2" opacity="0.22" transform="rotate(-35 520 430)" stroke-dasharray="121 550"/>
<circle cx="330" cy="540" r="80" fill="none" stroke="url(#dark)" stroke-width="26"/><circle cx="330" cy="540" r="80" fill="none" stroke="#ffffff" stroke-width="7.8" opacity="0.22" transform="rotate(-35 330 540)" stroke-dasharray="88 400"/>
<circle cx="560" cy="230" r="62" fill="none" stroke="url(#red)" stroke-width="22"/><circle cx="560" cy="230" r="62" fill="none" stroke="#ffffff" stroke-width="6.6" opacity="0.22" transform="rotate(-35 560 230)" stroke-dasharray="68.2 310"/>
<circle cx="190" cy="520" r="44" fill="none" stroke="url(#brass)" stroke-width="18"/>
<circle cx="640" cy="560" r="36" fill="none" stroke="url(#brass)" stroke-width="16"/>
</svg>
